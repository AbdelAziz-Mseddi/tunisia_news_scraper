[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tunisia-news-scraper"
version = "0.1.0"
description = "Scrape Tunisian news outlets into a common article schema and analyze them locally."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31.0",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.0.0",
  "feedparser>=6.0.10",
  "python-dateutil>=2.8.2",
  "playwright>=1.40.0",
]

[project.optional-dependencies]
analysis = [
  "torch>=2.1.0",
  "transformers>=4.35.0",
]

[project.scripts]
tunisia-scrape = "main:main"
tunisia-analyze = "analyze:main"

[tool.setuptools]
py-modules = ["analyze", "config", "main", "models", "storage"]

[tool.setuptools.packages.find]
include = ["analysis*", "scrapers*"]